name: Deploy static site to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: churchofsynthesis-plesk-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PLESK_FTP_SERVER: ${{ secrets.PLESK_FTP_SERVER }}
      PLESK_FTP_USERNAME: ${{ secrets.PLESK_FTP_USERNAME }}
      PLESK_FTP_PASSWORD: ${{ secrets.PLESK_FTP_PASSWORD }}
      PLESK_FTP_PORT: ${{ secrets.PLESK_FTP_PORT }}
      PLESK_FTP_SCHEME: ${{ secrets.PLESK_FTP_SCHEME }}
      PLESK_FTP_SERVER_DIR: ${{ secrets.PLESK_FTP_SERVER_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "$PLESK_FTP_SERVER" || -z "$PLESK_FTP_USERNAME" || -z "$PLESK_FTP_PASSWORD" ]]; then
            echo "::notice::Plesk FTP secrets are not configured. Skipping live deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Upload static files
        if: steps.secrets.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          scheme="${PLESK_FTP_SCHEME:-ftp}"
          port="${PLESK_FTP_PORT:-21}"
          remote_dir="${PLESK_FTP_SERVER_DIR:-httpdocs}"
          remote_dir="${remote_dir#/}"
          remote_dir="${remote_dir%/}"

          curl_args=(--fail --silent --show-error --ftp-pasv --ftp-create-dirs)
          if [[ "$scheme" == "ftps" ]]; then
            curl_args+=(--ssl-reqd)
          fi

          mapfile -t files < <(
            find . -type f \
              ! -path './.git/*' \
              ! -path './.github/*' \
              ! -path './api/*' \
              ! -name 'README.md' \
              ! -name 'vercel.json' \
              | sort
          )

          echo "Uploading ${#files[@]} static files to Plesk..."
          for file in "${files[@]}"; do
            rel="${file#./}"
            curl "${curl_args[@]}" \
              --user "$PLESK_FTP_USERNAME:$PLESK_FTP_PASSWORD" \
              --upload-file "$file" \
              "$scheme://$PLESK_FTP_SERVER:$port/$remote_dir/$rel"
          done

          echo "Plesk deploy completed."
